# 3.3 — shorter timeouts, then a bounded retry.
app:
  chat:
    stage: retry
    async-enabled: true
    connect-timeout-ms: 500
    read-timeout-ms: 2000
    retries: 2
    # All attempts and the backoff between them stop at this wall clock.
    retry-budget-ms: 5000
    backoff-initial-ms: 200
    backoff-multiplier: 2
