# 3.4 — after repeated failures, stop calling Ollama until the cooldown elapses.
app:
  chat:
    stage: breaker
    async-enabled: true
    connect-timeout-ms: 500
    read-timeout-ms: 2000
    retries: 2
    retry-budget-ms: 5000
    backoff-initial-ms: 200
    backoff-multiplier: 2
    circuit-breaker-enabled: true
    circuit-failure-threshold: 3
    circuit-open-ms: 15000
