global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: player-branch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          deployment: branch
          api_port: "8080"
  - job_name: player-main
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18081"]
        labels:
          deployment: main
          api_port: "18080"
